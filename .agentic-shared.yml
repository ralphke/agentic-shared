# This is the canonical source repository, not a consumer of its own assets.
# The release pin is a reference baseline; all asset groups remain locally owned.
source:
  repository: ralphke/agentic-shared
  version: v1.3.0

assets:
  agents: local
  skills: local
  prompts: local
  instructions: local
  workflows: local
  issue_templates: local
  specs: local

protected_paths:
  - .github/agents/local/**
  - .github/skills/local/**
  - .github/prompts/local/**
  - .github/instructions/local/**
  - openspec/changes/**
  - .github/workflows/agentic-shared-sync.yml
  - .github/workflows/sdlc-orchestrator.yml
