schema: spec-driven
githubCopilot:
  cloudAgent: true

context: |
  Project name: Software Fabric - Autonomous SDLC
  Project description: A spec-driven autonomous software development lifecycle
  where specialized AI agent personas collaborate to transform a raw idea into
  a fully tested, secure, and autonomously operated application.
  Homepage: https://github.com/Fission-AI/OpenSpec
  Active profile: spec-driven
  OpenSpec layout: specs=openspec/specs, changes=openspec/changes,
  archive=openspec/changes/archive.

  Domain ownership:
    idea-capture: owner=product-owner; Captures raw ideas and refines them into structured proposals.
    sdlc-process: owner=architect; The end-to-end autonomous SDLC workflow and handoff protocol.
    personas: owner=architect; Agent personas, skills, and collaboration contracts.
    security-standards: owner=security-engineer; OWASP alignment, threat modelling, and security gate rules.
    testing-standards: owner=qa-engineer; Testing strategy, coverage minimums, and quality gates.
    operations: owner=devops-sre; Deployment patterns, monitoring SLOs, and runbooks.
    legal-compliance: owner=legal-compliance; License compliance, IP ownership, and regulatory requirements.

  Work mode: Fabric by default; explicit standalone OpenSpec uses upstream
  workflows without Fabric agent orchestration. Repository controls still apply.
  The following Fabric policies are not OpenSpec CLI enforcement.

  Fabric quality gates, all required before Fabric archive:
    require_tests=true: pytest or dotnet test must be green.
    require_security_review=true: no HIGH or CRITICAL CVEs.
    require_code_review=true: at least one review approval.
    require_ci_pass=true: GitHub Actions CI workflow must be green.
    min_coverage_pct=80: new code coverage floor.

  Persona roster and files:
    product-owner=.github/agents/product-owner.agent.md
    ux-designer=.github/agents/ux-designer.agent.md
    architect=.github/agents/architect.agent.md
    developer=.github/agents/developer.agent.md
    qa-engineer=.github/agents/qa-engineer.agent.md
    security-engineer=.github/agents/security-engineer.agent.md
    devops-sre=.github/agents/devops-sre.agent.md
    code-reviewer=.github/agents/code-reviewer.agent.md
    operations-sre=.github/agents/operations-sre.agent.md
    legal-compliance=.github/agents/legal-compliance.agent.md

  MCP servers used by this project, configured in .vscode/mcp.json:
    openspec-filesystem: Filesystem access scoped to openspec/ for spec management.
    github-mcp: GitHub API access for issues, PRs, and workflow triggers.
  Persona definitions live under .github/agents/.
  Runtime MCP configuration lives in .vscode/mcp.json.

rules:
  proposal:
    - Include affected domains, scope, non-goals, and acceptance criteria.
  design:
    - Record architectural decisions and preserve the repository's persona handoffs.
  tasks:
    - Keep tasks independently checkable and aligned with the approved design.

operations:
  apply:
    guidance:
      - In Fabric mode, require complete proposal, delta specs, design, and tasks and explicit acceptance of the current proposal/spec before implementation; skipped required artifacts and CLI readiness are not waivers.
      - In Fabric mode, do not archive active changes merely because all tasks are complete.
      - In Fabric mode, keep implementation scoped to the approved change.
  archive:
    guidance:
      - In Fabric mode, confirm tests, security review, code review, CI, and coverage gates before archiving.
      - In Fabric mode, block archive-driven sync writes and moves if required artifacts/tasks or any mandatory gate is incomplete or unverifiable; user confirmation cannot override mandatory gates.
      - In Fabric mode, follow the full archive checklist in .github/instructions/fabric-workflow.instructions.md, including acceptance, scenario tests, removed references, and applicable legal and operational gates.
      - In Fabric mode, sync and verify every delta before archive, including bulk archive; never archive a change with excluded or unverified deltas.
