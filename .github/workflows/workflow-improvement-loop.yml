name: Workflow Improvement Loop

on:
  schedule:
    - cron: "15 5 * * 1"
  workflow_dispatch: {}

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  retrospective:
    name: "🔁 Workflow Retrospective"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Analyze issue and PR history
        id: analyze
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const days = 90;
            const since = new Date(Date.now() - days * 24 * 60 * 60 * 1000);

            const pulls = [];
            for (let page = 1; page <= 10; page++) {
              const { data } = await github.rest.pulls.list({
                owner,
                repo,
                state: "all",
                sort: "created",
                direction: "desc",
                per_page: 100,
                page
              });
              if (data.length === 0) break;
              pulls.push(...data);
              if (new Date(data[data.length - 1].created_at) < since) break;
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              since: since.toISOString(),
              per_page: 100
            });

            const historyPrs = pulls.filter(pr => new Date(pr.created_at) >= since);
            const mergedPrs = historyPrs.filter(pr => pr.merged_at);
            const historyIssues = issues.filter(i => !i.pull_request && new Date(i.created_at) >= since);
            const stageLabelCoverage = mergedPrs.length === 0
              ? 0
              : mergedPrs.filter(pr => (pr.labels || []).some(l => l.name && l.name.startsWith("stage:"))).length / mergedPrs.length;

            const leadTimesHours = mergedPrs.map(pr => {
              const start = new Date(pr.created_at).getTime();
              const end = new Date(pr.merged_at).getTime();
              return Math.max(0, (end - start) / (1000 * 60 * 60));
            }).sort((a, b) => a - b);

            const medianLeadTimeHours = leadTimesHours.length === 0
              ? null
              : leadTimesHours[Math.floor(leadTimesHours.length / 2)];

            const openIssues = historyIssues.filter(i => i.state === "open").length;
            const closedIssues = historyIssues.filter(i => i.state === "closed").length;
            const sparseHistory = historyPrs.length === 0 && historyIssues.length === 0;

            const recommendations = [];
            if (sparseHistory) {
              recommendations.push("No issue/PR history found in the last 90 days. Apply baseline skill checklists and collect first-cycle metrics.");
              recommendations.push("Use `.github/skills/workflow-retrospective.md` as the canonical procedure for future evidence-driven updates.");
            } else {
              if (stageLabelCoverage < 0.8) {
                recommendations.push(`Stage label coverage is ${(stageLabelCoverage * 100).toFixed(0)}%; target >= 80% by tightening labeling automation.`);
              }
              if (medianLeadTimeHours !== null && medianLeadTimeHours > 72) {
                recommendations.push(`Median PR lead time is ${medianLeadTimeHours.toFixed(1)}h; break work into smaller, stage-ready increments.`);
              }
              if (openIssues > closedIssues) {
                recommendations.push("Open issues exceed closed issues in the analysis window; prioritize triage and closure flow.");
              }
            }

            if (recommendations.length === 0) {
              recommendations.push("Current workflow signals are stable. Keep current gates and continue weekly retrospectives.");
            }

            const reportTitle = "Workflow Improvement Report";
            const reportBody = [
              "## 🔁 Workflow Improvement Report",
              "",
              `Window: last ${days} days`,
              "",
              "| Signal | Value |",
              "|---|---|",
              `| Issues analyzed | ${historyIssues.length} |`,
              `| PRs analyzed | ${historyPrs.length} |`,
              `| Merged PRs | ${mergedPrs.length} |`,
              `| Stage label coverage | ${(stageLabelCoverage * 100).toFixed(0)}% |`,
              `| Median PR lead time (hours) | ${medianLeadTimeHours === null ? "n/a" : medianLeadTimeHours.toFixed(1)} |`,
              `| Open issues (window) | ${openIssues} |`,
              `| Closed issues (window) | ${closedIssues} |`,
              "",
              "### Recommended Improvements",
              ...recommendations.map((r, i) => `${i + 1}. ${r}`),
              "",
              "### Skill to apply",
              "- `.github/skills/workflow-retrospective.md`",
              "",
              "### Maintainer policy",
              "- Create improvement PRs from a feature branch.",
              "- Do not merge process changes to `main` without human review."
            ].join("\n");

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "workflow-improvement",
              per_page: 100
            });

            const target = existing.find(i => i.title === reportTitle);
            if (target) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: target.number,
                body: reportBody
              });
              core.info(`Updated issue #${target.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: reportTitle,
                body: reportBody,
                labels: ["workflow-improvement"]
              });
              core.info(`Created issue #${created.data.number}`);
            }
