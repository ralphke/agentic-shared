name: Fabric Merge Gate

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Evaluation never merges; request-merge is an explicit protected operation
        type: choice
        options: [evaluate, request-merge, invalidate]
        default: evaluate
        required: true
      pr_number:
        description: Explicit PR number
        type: string
        required: true
      expected_head:
        description: Full current PR head SHA, mandatory for request-merge
        type: string
        required: false
  pull_request_target:
    types: [opened, synchronize, reopened, edited, converted_to_draft, ready_for_review]
  repository_dispatch:
    types: [fabric-evidence-changed]
  check_run:
    types: [completed, rerequested]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  merge-gate:
    name: Fabric protected merge control
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'check_run' ||
       (github.event.check_run.name != 'Fabric / merge' &&
        github.event.check_run.name != 'Fabric / release'))
    environment: fabric-gate-control
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout protected default only, never PR code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Explicit operation or supplementary invalidation
        env:
          GH_TOKEN: ${{ secrets.FABRIC_GATE_APP_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          OPERATION: ${{ inputs.operation }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          controller=.github/skills/fabric-verify-change/scripts/run_fabric_gate_control.py
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            case "$OPERATION" in
              evaluate) python3 "$controller" --mode merge --number "$PR_NUMBER" ;;
              request-merge) python3 "$controller" --mode merge --number "$PR_NUMBER" --expected-head "$EXPECTED_HEAD" --execute-merge ;;
              invalidate) python3 "$controller" --mode invalidate --number "$PR_NUMBER" ;;
              *) exit 1 ;;
            esac
          else
            python3 "$controller" --mode invalidate
          fi
