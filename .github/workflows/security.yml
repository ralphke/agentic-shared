name: Security

# Consolidated security workflow — combines supply-chain verification and
# devcontainer image scanning into a single pipeline.
#
# Supply-chain checks (all PRs / pushes to main):
#   - CycloneDX SBOM generation + Grype vulnerability scan
#   - Dependency confusion detection (namespace collision check)
#   - Lockfile integrity (hash pinning for production requirements)
#   - Container base image digest pinning check
#
# Devcontainer image checks:
#   - Trivy fast scan — every PR / push
#   - Trivy deep scan — monthly schedule or workflow_dispatch
#
# All HIGH/CRITICAL findings BLOCK merge.
# SARIF results are uploaded to GitHub Code Scanning when available.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly supply-chain re-scan (Tuesday 03:17 UTC)
    - cron: '17 3 * * 2'
    # Monthly deep devcontainer image + filesystem scan (1st at 02:23 UTC)
    - cron: '23 2 1 * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Image scan depth (fast = HIGH/CRITICAL only; deep = full filesystem)'
        required: true
        default: 'fast'
        type: choice
        options:
          - fast
          - deep

permissions:
  contents: read
  security-events: write
  actions: read
  packages: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.54.1
  DEVCONTAINER_IMAGE_NAME: agentic-coding-devcontainer
  # Chainguard rebuilds this image daily so the bundled vulnerability DB is
  # always fresh (well within Grype's 5-day max-age limit).
  GRYPE_IMAGE: cgr.dev/chainguard/grype:latest

jobs:
  # ─── CODE SCANNING AVAILABILITY PROBE ─────────────────────────────────────
  # Single shared probe eliminates the duplicate step that previously existed
  # in every job of both supply-chain-verification.yml and security-scan.yml.
  code-scanning-probe:
    name: "🔍 Code Scanning Probe"
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - name: Detect code scanning availability
        id: probe
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/code-scanning/default-setup")
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "204" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  # ─── SBOM + VULNERABILITY SCAN ────────────────────────────────────────────
  sbom-and-vuln-scan:
    name: "📦 SBOM + Vulnerability Scan"
    runs-on: ubuntu-latest
    needs: code-scanning-probe
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0

      - name: Generate CycloneDX SBOM (syft)
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            anchore/syft:v1.4.1 \
            /src -o cyclonedx-json=/src/sbom.cyclonedx.json \
            --scope all-layers
          echo "✅ SBOM generated: sbom.cyclonedx.json"
          jq '.components | length' sbom.cyclonedx.json | xargs -I{} echo "Components in SBOM: {}"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90

      # The Chainguard image is rebuilt daily so its bundled DB is always
      # within Grype's 5-day max-age limit — no manual db update needed.
      - name: Vulnerability scan (grype) — BLOCKING on HIGH+
        run: |
          docker run --rm \
            -v "$PWD/sbom.cyclonedx.json:/sbom.cyclonedx.json:ro" \
            "$GRYPE_IMAGE" \
            sbom:/sbom.cyclonedx.json \
            --fail-on high \
            --output json > grype-report.json
          echo "✅ Grype scan passed — no HIGH or CRITICAL vulnerabilities"

      - name: Upload Grype report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-report-${{ github.sha }}
          path: grype-report.json
          retention-days: 30

      - name: Convert Grype report to SARIF
        if: always()
        run: |
          docker run --rm \
            -v "$PWD/sbom.cyclonedx.json:/sbom.cyclonedx.json:ro" \
            "$GRYPE_IMAGE" \
            sbom:/sbom.cyclonedx.json \
            --output sarif > grype-results.sarif || true

      - name: Upload Grype SARIF to GitHub Code Scanning
        if: always() && needs.code-scanning-probe.outputs.enabled == 'true' && hashFiles('grype-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: grype-results.sarif
          category: grype-sbom-scan

  # ─── DEPENDENCY CONFUSION DETECTION ──────────────────────────────────────
  dependency-confusion:
    name: "🔀 Dependency Confusion Detection"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Check PyPI for dependency confusion (Python)
        if: hashFiles('**/requirements*.txt') != ''
        run: |
          set -euo pipefail
          CONFUSED=0
          while IFS= read -r req_file; do
            echo "Checking $req_file..."
            while IFS= read -r pkg; do
              CLEAN=$(echo "$pkg" | sed 's/[>=<!\[].*//' | sed 's/#.*//' | tr -d ' ')
              [ -z "$CLEAN" ] && continue

              HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
                "https://pypi.org/pypi/${CLEAN}/json" 2>/dev/null || echo "000")

              if [ "$HTTP_STATUS" = "200" ]; then
                FIRST_RELEASE=$(curl -sf "https://pypi.org/pypi/${CLEAN}/json" \
                  | jq -r '.releases | keys_unsorted | sort | .[0]' 2>/dev/null || echo "unknown")
                echo "  ✅ ${CLEAN} — found on PyPI (first release: ${FIRST_RELEASE})"
              elif [ "$HTTP_STATUS" = "404" ]; then
                echo "::error::PHANTOM PACKAGE '${CLEAN}' — not found on PyPI (404). Possible hallucination or dependency confusion. File: ${req_file}"
                CONFUSED=1
              else
                echo "::warning::Could not verify '${CLEAN}' on PyPI (HTTP ${HTTP_STATUS}). Manual review recommended."
              fi
            done < <(grep -E '^[a-zA-Z]' "$req_file" | sed '/^#/d' || true)
          done < <(find . -name 'requirements*.txt' -not -path '*/.venv*' -not -path '*/node_modules*')

          if [ "$CONFUSED" -eq 1 ]; then
            echo ""
            echo "::error::One or more phantom packages detected. Merge is BLOCKED."
            exit 1
          fi
          echo "✅ All Python packages verified on PyPI"

      - name: Check npm for dependency confusion (Node)
        if: hashFiles('**/package.json') != ''
        run: |
          set -euo pipefail
          CONFUSED=0
          for PKG in $(node -e \
            "const p=require('./package.json'); \
             console.log(Object.keys({...(p.dependencies||{}), ...(p.devDependencies||{})}).join('\n'))" \
            2>/dev/null || true); do

            HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              "https://registry.npmjs.org/${PKG}" 2>/dev/null || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "  ✅ ${PKG} — found on npm"
            elif [ "$HTTP_STATUS" = "404" ]; then
              echo "::error::PHANTOM PACKAGE '${PKG}' — not found on npm (404). Possible hallucination or dependency confusion."
              CONFUSED=1
            else
              echo "::warning::Could not verify '${PKG}' on npm (HTTP ${HTTP_STATUS}). Manual review recommended."
            fi
          done

          if [ "$CONFUSED" -eq 1 ]; then
            echo "::error::One or more phantom npm packages detected. Merge is BLOCKED."
            exit 1
          fi
          echo "✅ All npm packages verified on registry"

  # ─── LOCKFILE INTEGRITY CHECK ──────────────────────────────────────────────
  lockfile-integrity:
    name: "🔐 Lockfile Integrity"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Verify Python requirements use hash pinning
        if: hashFiles('**/requirements*.txt') != ''
        run: |
          set -euo pipefail
          WARNINGS=0
          while IFS= read -r req_file; do
            # Skip dev/test requirements from hash enforcement
            if [[ "$req_file" == *"dev"* ]] || [[ "$req_file" == *"test"* ]]; then
              echo "ℹ️  Skipping hash check for dev/test requirements: $req_file"
              continue
            fi
            if grep -qE '^[a-zA-Z]' "$req_file" && ! grep -q '\-\-hash=' "$req_file"; then
              echo "::error file=${req_file}::Production requirements file lacks hash pinning."
              echo "  Run: pip-compile --generate-hashes requirements.in -o requirements.txt"
              WARNINGS=1
            else
              echo "  ✅ ${req_file} — hash pinning present"
            fi
          done < <(find . -name 'requirements*.txt' -not -path '*/.venv*' -not -path '*/node_modules*')
          [ "$WARNINGS" -eq 0 ] || exit 1

      - name: Verify Node package-lock.json is committed
        if: hashFiles('**/package.json') != ''
        run: |
          set -euo pipefail
          if [ -f "package.json" ] && [ ! -f "package-lock.json" ]; then
            echo "::error::package.json found but package-lock.json is missing."
            echo "  Run: npm install  (which generates package-lock.json) and commit it."
            exit 1
          fi
          if [ -f "package-lock.json" ]; then
            echo "✅ package-lock.json is committed"
          fi

      - name: Verify .NET packages.lock.json if present
        if: hashFiles('**/*.csproj') != ''
        run: |
          set -euo pipefail
          FOUND_LOCK=0
          while IFS= read -r csproj; do
            PROJ_DIR=$(dirname "$csproj")
            if [ -f "${PROJ_DIR}/packages.lock.json" ]; then
              echo "  ✅ ${csproj} — packages.lock.json present"
              FOUND_LOCK=1
            fi
          done < <(find . -name '*.csproj' -not -path '*/obj/*')
          if [ "$FOUND_LOCK" -eq 0 ]; then
            echo "::warning::No packages.lock.json found for .NET projects."
            echo "  Consider enabling: <RestoreLockedMode>true</RestoreLockedMode> and running: dotnet restore --lock-file-path packages.lock.json"
          fi

  # ─── CONTAINER BASE IMAGE DIGEST PINNING CHECK ────────────────────────────
  container-image-pinning:
    name: "🐳 Container Image Digest Pinning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Check Dockerfiles for digest-pinned base images
        if: hashFiles('**/Dockerfile', '**/*.dockerfile', '**/docker-compose*.yml') != ''
        run: |
          set -euo pipefail
          UNPINNED=0

          while IFS= read -r dockerfile; do
            while IFS= read -r from_line; do
              [[ "$from_line" =~ ^FROM\ scratch ]] && continue
              [[ "$from_line" =~ \$\{ ]] && continue
              if ! echo "$from_line" | grep -q '@sha256:'; then
                echo "::warning file=${dockerfile}::Base image not pinned to digest: '${from_line}'"
                echo "  Pin using: docker inspect --format='{{index .RepoDigests 0}}' <image>"
                UNPINNED=1
              else
                echo "  ✅ ${dockerfile}: ${from_line}"
              fi
            done < <(grep -Ei '^FROM ' "$dockerfile" || true)
          done < <(find . \( -name 'Dockerfile' -o -name '*.dockerfile' \) -not -path '*/node_modules*')

          if [ -f ".devcontainer/devcontainer.json" ]; then
            IMAGE_REF=$(python3 -c "import json; d=json.load(open('.devcontainer/devcontainer.json')); print(d.get('image',''))" 2>/dev/null || echo "")
            if [ -n "$IMAGE_REF" ] && ! echo "$IMAGE_REF" | grep -q '@sha256:'; then
              echo "::warning file=.devcontainer/devcontainer.json::devcontainer image not pinned to digest: '${IMAGE_REF}'"
              echo "  Consider adding @sha256:<digest> to prevent tag drift."
              UNPINNED=1
            elif [ -n "$IMAGE_REF" ]; then
              echo "  ✅ devcontainer.json: ${IMAGE_REF}"
            fi
          fi

          if [ "$UNPINNED" -eq 1 ]; then
            echo "::warning::One or more container images are not digest-pinned. See warnings above."
          else
            echo "✅ All container base images are pinned to digest"
          fi

  # ─── DEVCONTAINER IMAGE SCAN — FAST (every PR / push) ────────────────────
  trivy-image-fast:
    name: "🛡️ Trivy Image Scan (fast)"
    runs-on: ubuntu-latest
    needs: code-scanning-probe
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.scan_type == 'fast')
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Resolve GHCR image reference
        id: image_ref
        run: |
          GHCR_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "devcontainer_image=ghcr.io/${GHCR_OWNER}/${DEVCONTAINER_IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Pull devcontainer image from GHCR (fallback to local build)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if ! docker pull "${{ steps.image_ref.outputs.devcontainer_image }}"; then
            echo "GHCR pull unavailable; building local devcontainer image as fallback"
            docker compose -f .devcontainer/docker-compose.yml build agentic-coding
            docker tag agentic-coding-image:latest "${{ steps.image_ref.outputs.devcontainer_image }}"
          fi

      - name: Generate Trivy image SARIF (fast)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --format sarif --output /work/trivy-image-fast.sarif --exit-code 0 --no-progress "${{ steps.image_ref.outputs.devcontainer_image }}"

      - name: Enforce HIGH/CRITICAL gate (image)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --exit-code 1 --no-progress "${{ steps.image_ref.outputs.devcontainer_image }}"

      - name: Upload Trivy image results
        if: always() && needs.code-scanning-probe.outputs.enabled == 'true' && hashFiles('trivy-image-fast.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-fast.sarif
          category: trivy-devcontainer-image

      - name: Add fast scan summary
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --format json "${{ steps.image_ref.outputs.devcontainer_image }}" > trivy-image-fast.json

          HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-image-fast.json)
          CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-image-fast.json)

          {
            echo "## DevContainer Image Scan (Fast)"
            echo ""
            echo "| Scan | High | Critical |"
            echo "|---|---:|---:|"
            echo "| Image (${{ steps.image_ref.outputs.devcontainer_image }}) | ${HIGH_COUNT} | ${CRITICAL_COUNT} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── DEVCONTAINER IMAGE SCAN — DEEP (schedule / dispatch) ─────────────────
  trivy-deep:
    name: "🛡️ Trivy Image Scan (deep)"
    runs-on: ubuntu-latest
    needs: code-scanning-probe
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scan_type == 'deep')
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Resolve GHCR image reference
        id: image_ref
        run: |
          GHCR_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "devcontainer_image=ghcr.io/${GHCR_OWNER}/${DEVCONTAINER_IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Pull devcontainer image from GHCR (fallback to local build)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if ! docker pull "${{ steps.image_ref.outputs.devcontainer_image }}"; then
            echo "GHCR pull unavailable; building local devcontainer image as fallback"
            docker compose -f .devcontainer/docker-compose.yml build agentic-coding
            docker tag agentic-coding-image:latest "${{ steps.image_ref.outputs.devcontainer_image }}"
          fi

      - name: Generate Trivy deep image SARIF
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --format sarif --output /work/trivy-deep-image.sarif --exit-code 0 --no-progress "${{ steps.image_ref.outputs.devcontainer_image }}"

      - name: Generate Trivy deep filesystem SARIF
        run: |
          docker run --rm -v "$PWD:/repo" "$TRIVY_IMAGE" \
            fs --severity HIGH,CRITICAL --scanners vuln,config --format sarif --output /repo/trivy-deep-fs.sarif --exit-code 0 --no-progress /repo

      - name: Upload deep image results
        if: always() && needs.code-scanning-probe.outputs.enabled == 'true' && hashFiles('trivy-deep-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-deep-image.sarif
          category: trivy-devcontainer-deep-image

      - name: Upload deep filesystem results
        if: always() && needs.code-scanning-probe.outputs.enabled == 'true' && hashFiles('trivy-deep-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-deep-fs.sarif
          category: trivy-devcontainer-deep-fs

      - name: Add deep scan summary
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo" "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --format json "${{ steps.image_ref.outputs.devcontainer_image }}" > trivy-deep-image.json

          docker run --rm -v "$PWD:/repo" "$TRIVY_IMAGE" \
            fs --severity HIGH,CRITICAL --format json /repo > trivy-deep-fs.json

          IMG_HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-deep-image.json)
          IMG_CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-deep-image.json)
          FS_HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-deep-fs.json)
          FS_CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-deep-fs.json)

          {
            echo "## DevContainer Security Summary (Deep)"
            echo ""
            echo "| Scan | High | Critical |"
            echo "|---|---:|---:|"
            echo "| Image (${{ steps.image_ref.outputs.devcontainer_image }}) | ${IMG_HIGH} | ${IMG_CRITICAL} |"
            echo "| Filesystem (repo) | ${FS_HIGH} | ${FS_CRITICAL} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── SECURITY SUMMARY ─────────────────────────────────────────────────────
  security-summary:
    name: "📊 Security Summary"
    runs-on: ubuntu-latest
    needs:
      - sbom-and-vuln-scan
      - dependency-confusion
      - lockfile-integrity
      - container-image-pinning
      - trivy-image-fast
    if: always()
    steps:
      - name: Write job summary
        run: |
          {
            echo "## Security Summary"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| SBOM + Vulnerability Scan | ${{ needs.sbom-and-vuln-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Dependency Confusion | ${{ needs.dependency-confusion.result == 'success' && '✅ Passed' || needs.dependency-confusion.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
            echo "| Lockfile Integrity | ${{ needs.lockfile-integrity.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Container Image Pinning | ${{ needs.container-image-pinning.result == 'success' && '✅ Passed' || '⚠️ Warnings' }} |"
            echo "| Trivy Image Scan | ${{ needs.trivy-image-fast.result == 'success' && '✅ Passed' || needs.trivy-image-fast.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo "Branch: \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
