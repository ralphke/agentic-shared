name: OpenSpec Archive Readiness

on:
  workflow_dispatch:
    inputs:
      change_slug:
        description: OpenSpec change folder to validate
        required: true
        type: string
      pr_number:
        description: Optional PR number whose checks and approvals must be ready
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  archive-readiness:
    name: Validate archive readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout change
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Validate OpenSpec artifacts and completed tasks
        run: python3 .github/scripts/validate_openspec_change.py '${{ inputs.change_slug }}'

      - name: Verify pull request checks and approval
        if: inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr checks "$PR_NUMBER" --required
          approvals=$(gh pr view "$PR_NUMBER" --json reviews --jq '[.reviews[] | select(.state == "APPROVED")] | length')
          if [ "$approvals" -lt 1 ]; then
            echo "No approving pull request review was found."
            exit 1
          fi
