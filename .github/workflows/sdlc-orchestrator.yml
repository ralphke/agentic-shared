name: SDLC Orchestrator
on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  # ─── IDEA INTAKE ──────────────────────────────────────────────────────────
  # Triggered when an issue gets the `idea` label (from the Idea Capture template)
  idea-intake:
    name: "💡 Idea → Proposal"
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'idea'
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge idea
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## 🏭 Software Fabric — Idea Received',
                '',
                'Your idea has been received for assessment, not repository capture.',
                '',
                '**Next step:** The Product Owner Agent will assess it and offer Proceed, Defer, or Do not pursue before any repository writes.',
                'A raw idea, label, priority, or kickoff alone does not authorize capture. Missing input pauses capture.',
                'Defer or rejection writes no repository files, never deletes existing work, and is not successful archive.',
                'An explicit request to create named repository artifacts counts as Proceed; do not repeat that decision at handoff.',
                '',
                '**To start the pipeline now**, run in VS Code Copilot chat:',
                '```',
                `/opsx:propose  ← include issue #${context.issue.number} as the Product Owner input`,
                '```',
                '',
                '**Or start the planning coordinator:**',
                '```',
                `Use the software-fabric-kickoff skill and reference issue #${context.issue.number}`,
                '```',
                '',
                '**Pipeline stages:**',
                '1. 📋 Proposal (Product Owner)',
                '2. 🎨 UX Design when visual interfaces are affected (UX Designer)',
                '3. 🏗️ Design + Tasks (Architect)',
                '4. 💻 Implementation (Developer)',
                '5. 🧪 Tests (QA Engineer)',
                '6. 🔒 Security Review (Security Engineer)',
                '7. ⚖️ Legal Review when risk requires it (Legal & Compliance)',
                '8. 👁️ Code Review (Code Reviewer)',
                '9. 🚀 Deploy (DevOps/SRE)',
                '10. 📊 Monitor + Archive (Operations SRE)',
              ].join('\n')
            });

      - name: Add stage label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['stage:proposal']
            });

  # ─── STAGE GATE: PROPOSAL → UX ────────────────────────────────────────────
  stage-ux-gate:
    name: "🎨 Stage: UX Design"
    if: |
      github.event_name == 'pull_request' &&
      ((github.event.action == 'labeled' && github.event.label.name == 'stage:ux') ||
       (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'stage:ux')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate UX applicability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 .github/skills/test-generation/scripts/validate_ux_gate.py \
            --phase ux --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Comment — UX design stage started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '## 🎨 Stage: UX Design',
                '',
                '**UX Designer Agent** — your turn.',
                '',
                'Read each accepted proposal UX Applicability decision.',
                'For visual changes only: create `openspec/changes/<slug>/ux-brief.md`.',
                'Cover readable content, WCAG 2.2 AA accessibility, visible and discoverable controls,',
                'responsive desktop/tablet/mobile behavior, and keyboard and touch interactions.',
                '',
                'For nonvisual CLI/API/framework changes: create no UX artifacts or UX tests; go directly to `stage:design`.',
                'Pass the completed visual brief to the Architect by applying `stage:design`.',
              ].join('\n')
            });

  # ─── STAGE GATE: UX → DESIGN ──────────────────────────────────────────────
  stage-design-gate:
    name: "🏗️ Stage: Design"
    if: |
      github.event_name == 'pull_request' &&
      ((github.event.action == 'labeled' && github.event.label.name == 'stage:design') ||
       (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'stage:design')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate proposal and applicable UX brief
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 .github/skills/test-generation/scripts/validate_ux_gate.py \
            --phase design --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Comment — design stage started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '## 🏗️ Stage: Design',
                '',
                '**Architect Agent** — your turn.',
                'Require a UX brief only for accepted visual applicability; nonvisual work goes directly to functional design.',
                '',
                'Run in VS Code Copilot chat:',
                '```',
                'Use the spec-to-design skill after proposal acceptance; select the registered OpenSpec store when working in one.',
                '```',
                '',
                'Expected outputs:',
                '- `openspec/changes/<slug>/design.md`',
                '- `openspec/changes/<slug>/specs/<domain>/spec.md` (delta spec)',
                '- `openspec/changes/<slug>/tasks.md`',
              ].join('\n')
            });

  # ─── STAGE GATE: IMPLEMENT → TEST ─────────────────────────────────────────
  stage-test-gate:
    name: "🧪 Stage: Test"
    permissions:
      contents: read
      pull-requests: read
      checks: read
    if: |
      github.event_name == 'pull_request' &&
      ((github.event.action == 'labeled' && github.event.label.name == 'stage:test') ||
       (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'stage:test')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate test UX inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 .github/skills/test-generation/scripts/validate_ux_gate.py \
            --phase test --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Validate test stage artifacts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          if ! printf '%s\n' "$changed_files" | grep -Eq '(^|/)(tests?|testdata)/|(^|/)(test_.*\.py|.*_test\.py|.*Tests?\.cs)$|^openspec/changes/[^/]+/(tasks\.md|specs/[^/]+/spec\.md)$'; then
            echo "::error::stage:test requires test artifacts or change delta/task evidence in the PR."
            exit 1
          fi

      - name: Require a supported test project
        if: hashFiles('**/pytest.ini', '**/pyproject.toml', '**/setup.cfg', '**/*.csproj') == ''
        run: |
          echo "::error::No supported test project was found. Add pytest configuration or a .NET project."
          exit 1

      - name: Run tests (Python)
        if: hashFiles('**/pytest.ini', '**/pyproject.toml', '**/setup.cfg') != ''
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest pytest-cov
          python3 -m pytest --tb=short -q --cov --cov-report=term-missing --cov-fail-under=80

      - name: Run tests (.NET)
        if: hashFiles('**/*.csproj') != ''
        run: dotnet test --no-build --collect:"XPlat Code Coverage" -q

      - name: Validate applicable UX completion
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          UX_CHECK_NAMES: ${{ vars.UX_CHECK_NAMES }}
        run: |
          set -euo pipefail
          python3 .github/skills/test-generation/scripts/validate_ux_gate.py \
            --phase complete --base "$BASE_SHA" --head "$HEAD_SHA"

  stage-test-comment:
    name: "🧪 Stage: Test Comment"
    needs: stage-test-gate
    permissions:
      contents: read
      issues: write
      pull-requests: write
    if: |
      github.event_name == 'pull_request' &&
      ((github.event.action == 'labeled' && github.event.label.name == 'stage:test') ||
       (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'stage:test'))) &&
      needs.stage-test-gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Comment — test stage
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '## 🧪 Stage: Test',
                '',
                '**QA Engineer Agent** — your turn.',
                '',
                'Generate tests from spec scenarios and achieve ≥80% coverage.',
                'Use the test-generation skill. For visual changes, validate every UX criterion and record actual evidence.',
                'CLI/API/framework changes with no affected visual interface need no UX artifacts, UX tests, or UX tooling.',
                '',
                'Run in VS Code Copilot chat:',
                '```',
                'Use the openspec-apply-change skill; keep the selected OpenSpec store context active.',
                '```',
              ].join('\n')
            });

  # ─── STAGE GATE: TEST → SECURITY ──────────────────────────────────────────
  stage-security-gate:
    name: "🔒 Stage: Security"
    permissions:
      contents: read
      pull-requests: read
      checks: read
    if: |
      github.event_name == 'pull_request' &&
      ((github.event.action == 'labeled' && github.event.label.name == 'stage:security') ||
       (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'stage:security')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require applicable UX validation before security
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          UX_CHECK_NAMES: ${{ vars.UX_CHECK_NAMES }}
        run: |
          set -euo pipefail
          python3 .github/skills/test-generation/scripts/validate_ux_gate.py \
            --phase security --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Verify security automation checks are present and green
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          security_checks_json="$(gh pr checks "$PR_NUMBER" --json name,state)"

          matched_count="$(printf '%s' "$security_checks_json" | jq '[.[] | select((.name | ascii_downcase) | test("security|sbom|grype|dependency confusion|lockfile integrity"))] | length')"
          if [ "$matched_count" -eq 0 ]; then
            echo "::error::No security automation checks were found on this PR. Ensure Security workflow checks are configured."
            exit 1
          fi

          failing_checks="$(printf '%s' "$security_checks_json" | jq -r '.[] | select((.name | ascii_downcase) | test("security|sbom|grype|dependency confusion|lockfile integrity")) | select(.state != "SUCCESS") | "\(.name): \(.state)"')"
          if [ -n "$failing_checks" ]; then
            echo "::error::Security automation checks are not green:"
            echo "$failing_checks"
            exit 1
          fi

      - name: Confirm automated security workflow ownership
        run: |
          echo "Automated security checks are owned by the standalone Security workflow."
          echo "Require the Security workflow to pass in branch protection before stage:security."

  stage-security-comment:
    name: "🔒 Stage: Security Comment"
    needs: stage-security-gate
    permissions:
      contents: read
      issues: write
      pull-requests: write
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      ((github.event.action == 'labeled' && github.event.label.name == 'stage:security') ||
       (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'stage:security'))) &&
      needs.stage-security-gate.result != 'skipped' &&
      needs.stage-security-gate.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Comment — security stage
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ needs.stage-security-gate.result }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: success ? [
                '## 🔒 Stage: Security — Automated Check Handoff',
                '',
                '**Security Engineer Agent** — your turn for the manual review.',
                '',
                'The standalone `Security` workflow owns the automated security checks:',
                '- ✅ SAST and dependency vulnerability checks',
                '- ✅ SBOM generation and Grype scanning',
                '- ✅ Lockfile integrity and phantom package checks',
                '- ✅ Secret scanning and container image pinning',
                '',
                'The `Security` workflow must pass through branch protection before merge.',
                '',
                'Run the full security review in VS Code Copilot chat:',
                '```',
                'Use the openspec-verify-change skill with the selected OpenSpec store, when applicable.',
                '```',
                '',
                'Security gate: no CRITICAL or HIGH findings to merge.',
              ].join('\n') : [
                '## 🔒 Stage: Security — ❌ AUTOMATED GATE FAILED',
                '',
                '**Merge is BLOCKED.** A required UX validation or automated security check failed.',
                '',
                'Check this gate and the `Security` workflow run logs for details.',
                '',
                '**Developer Agent** — remediate all flagged issues and re-push.',
                '',
                '> No manual security review will be started until the automated gate passes.',
              ].join('\n')
            });

  # ─── STAGE GATE: SECURITY → LEGAL (WHEN REQUIRED) → REVIEW ──────────────
  stage-legal-gate:
    name: "⚖️ Stage: Legal Review"
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'stage:legal'
    runs-on: ubuntu-latest
    steps:
      - name: Comment — legal review stage
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '## ⚖️ Stage: Legal Review',
                '',
                '**Legal & Compliance Agent** — review the change using `.github/skills/legal-compliance-review.md`.',
                '',
                'Required output: post a Legal Risk Assessment comment with the decision, risk rating, evidence, and any remediation or counsel escalation.',
                '',
                'Disposition labels:',
                '- `legal:approved` — all required legal review and sign-off are complete; apply `stage:review` to continue.',
                '- `legal:blocked` — unresolved legal risk; review and deployment are blocked.',
                '',
                'A PR carrying `stage:legal` cannot enter review or deployment without `legal:approved`.',
              ].join('\n')
            });

  # ─── STAGE GATE: SECURITY → REVIEW ───────────────────────────────────────
  stage-review-gate:
    name: "👁️ Stage: Review"
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'stage:review'
    runs-on: ubuntu-latest
    steps:
      - name: Verify legal disposition
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(({ name }) => name);
            const legalBlocked = labels.includes('legal:blocked');
            const legalReviewRequired = labels.includes('stage:legal');
            const legalApproved = labels.includes('legal:approved');

            if (legalBlocked) {
              core.setFailed('stage:review is blocked while legal:blocked is present. Resolve the legal review before proceeding.');
            } else if (legalReviewRequired && !legalApproved) {
              core.setFailed('stage:review requires legal:approved when stage:legal is present. Post the Legal Risk Assessment and record a disposition.');
            }

      - name: Comment — review stage
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '## 👁️ Stage: Code Review',
                '',
                '**Code Reviewer Agent** — your turn.',
                '',
                'Run in VS Code Copilot chat:',
                '```',
                'Use the openspec-verify-change skill with the selected OpenSpec store, when applicable.',
                '```',
                '',
                'Review against `design.md` requirements and coding standards.',
                'Approve or REQUEST_CHANGES with specific, actionable feedback.',
              ].join('\n')
            });

  # ─── STAGE GATE: REVIEW → DEPLOY ──────────────────────────────────────────
  stage-deploy-gate:
    name: "🚀 Stage: Deploy"
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'stage:deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Verify legal disposition
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(({ name }) => name);
            const legalBlocked = labels.includes('legal:blocked');
            const legalReviewRequired = labels.includes('stage:legal');
            const legalApproved = labels.includes('legal:approved');

            if (legalBlocked) {
              core.setFailed('stage:deploy is blocked while legal:blocked is present. Resolve the legal review before proceeding.');
            } else if (legalReviewRequired && !legalApproved) {
              core.setFailed('stage:deploy requires legal:approved when stage:legal is present. Post the Legal Risk Assessment and record a disposition.');
            }

      - name: Comment — deploy stage
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '## 🚀 Stage: Deployment',
                '',
                '**DevOps/SRE Agent** — your turn.',
                '',
                'Merge this PR to trigger the staged deployment pipeline.',
                'The deployment workflow will:',
                '1. Build and scan the container image',
                '2. Deploy to dev → run smoke tests',
                '3. Deploy to staging → run integration tests',
                '4. Auto-advance to production (P2/P3) or await approval (P0/P1)',
                '',
                'Rollback is automatic if smoke tests fail.',
              ].join('\n')
            });

  # ─── SPEC STRUCTURE VALIDATION ────────────────────────────────────────────
  validate-openspec:
    name: "📋 Validate OpenSPEC Structure"
    if: |
      github.event_name == 'pull_request' &&
      (github.event.action == 'labeled' || github.event.action == 'ready_for_review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate openspec structure
        run: |
          echo "Validating OpenSPEC structure..."
          
          # Check config exists
          [ -f "openspec/config.yaml" ] && echo "✅ config.yaml present" || echo "❌ config.yaml missing"
          
          # Check domain specs exist
          for domain in sdlc-process personas idea-capture security-standards testing-standards operations legal-compliance; do
            [ -f "openspec/specs/$domain/spec.md" ] \
              && echo "✅ specs/$domain/spec.md present" \
              || echo "⚠️  specs/$domain/spec.md missing"
          done
          
          # Check changes directory
          [ -d "openspec/changes" ] && echo "✅ changes/ directory present" || echo "❌ changes/ missing"
          
          echo "OpenSPEC validation complete."
