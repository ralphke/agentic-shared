name: SDLC Orchestrator
on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled, unlabeled, ready_for_review]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  # ─── IDEA INTAKE ──────────────────────────────────────────────────────────
  # Triggered when an issue gets the `idea` label (from the Idea Capture template)
  idea-intake:
    name: "💡 Idea → Proposal"
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'idea'
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge idea
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## 🏭 Software Fabric — Idea Received',
                '',
                'Your idea has been queued for the autonomous SDLC pipeline.',
                '',
                '**Next step:** The Product Owner Agent will transform this into an OpenSPEC proposal.',
                '',
                '**To start the pipeline now**, run in VS Code Copilot chat:',
                '```',
                `/opsx:propose  ← then reference issue #${context.issue.number}`,
                '```',
                '',
                '**Or use the full kickoff prompt:**',
                '```',
                'Use the sdlc-kickoff prompt from .github/prompts/sdlc-kickoff.prompt.md',
                '```',
                '',
                '**Pipeline stages:**',
                '1. 📋 Proposal (Product Owner)',
                '2. 🏗️ Design + Tasks (Architect)',
                '3. 💻 Implementation (Developer)',
                '4. 🧪 Tests (QA Engineer)',
                '5. 🔒 Security Review (Security Engineer)',
                '6. 👁️ Code Review (Code Reviewer)',
                '7. 🚀 Deploy (DevOps/SRE)',
                '8. 📊 Monitor + Archive (Operations SRE)',
              ].join('\n')
            });

      - name: Add stage label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['stage:proposal']
            });

  # ─── STAGE GATE: PROPOSAL → DESIGN ────────────────────────────────────────
  stage-design-gate:
    name: "🏗️ Stage: Design"
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'stage:design'
    runs-on: ubuntu-latest
    steps:
      - name: Comment — design stage started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '## 🏗️ Stage: Design',
                '',
                '**Architect Agent** — your turn.',
                '',
                'Run in VS Code Copilot chat:',
                '```',
                '/opsx:apply  ← will detect design stage and create design.md + tasks.md',
                '```',
                '',
                'Expected outputs:',
                '- `spec/openspec/changes/<slug>/design.md`',
                '- `spec/openspec/changes/<slug>/tasks.md`',
              ].join('\n')
            });

  # ─── STAGE GATE: IMPLEMENT → TEST ─────────────────────────────────────────
  stage-test-gate:
    name: "🧪 Stage: Test"
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'stage:test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Run tests (Python)
        if: hashFiles('**/pytest.ini', '**/pyproject.toml', '**/setup.cfg') != ''
        run: |
          pip install -q pytest pytest-cov 2>/dev/null || true
          python3 -m pytest --tb=short -q 2>/dev/null || echo "::warning::Tests not yet set up"

      - name: Run tests (.NET)
        if: hashFiles('**/*.csproj') != ''
        run: dotnet test --no-build -q 2>/dev/null || echo "::warning::Tests not yet set up"

      - name: Comment — test stage
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '## 🧪 Stage: Test',
                '',
                '**QA Engineer Agent** — your turn.',
                '',
                'Generate tests from spec scenarios and achieve ≥80% coverage.',
                '',
                'Run in VS Code Copilot chat:',
                '```',
                '/opsx:apply  ← will detect test stage and generate test suites',
                '```',
              ].join('\n')
            });

  # ─── STAGE GATE: TEST → SECURITY ──────────────────────────────────────────
  stage-security-gate:
    name: "🔒 Stage: Security"
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'stage:security'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0  # full history needed for secrets scan

      # ── Python SAST — BLOCKING ──────────────────────────────────────────
      - name: Python SAST (bandit)
        if: hashFiles('**/*.py') != ''
        run: |
          pip install -q bandit
          # Exit 1 on MEDIUM+ (severity level -ll); fail the build
          bandit -r src/ -ll -f txt
        # NOTE: intentionally no continue-on-error — HIGH/CRITICAL findings BLOCK merge

      # ── Dependency CVE audit — BLOCKING ────────────────────────────────
      - name: Dependency audit (pip-audit)
        if: hashFiles('**/requirements*.txt', '**/pyproject.toml') != ''
        run: |
          pip install -q pip-audit
          # --fail-on-vuln exits non-zero when any vulnerability is found
          pip-audit --format columns --fail-on-vuln

      - name: npm audit
        if: hashFiles('**/package.json') != ''
        run: |
          # --audit-level high: exit non-zero only on HIGH or CRITICAL findings
          npm audit --audit-level high

      # ── Lockfile hash pinning check ─────────────────────────────────────
      - name: Verify dependency hash pinning (Python)
        if: hashFiles('**/requirements*.txt') != ''
        run: |
          set -euo pipefail
          UNPINNED=0
          while IFS= read -r req_file; do
            # Warn on any dependency missing both a pinned version and a hash
            if grep -Eq '^[a-zA-Z]' "$req_file"; then
              if ! grep -q '\-\-hash=' "$req_file"; then
                echo "::warning file=${req_file}::No hash pinning found. Consider using pip-compile --generate-hashes."
                UNPINNED=1
              fi
            fi
          done < <(find . -name 'requirements*.txt' -not -path '*/.venv*' -not -path '*/node_modules*')
          # Treat unpinned deps as a HIGH finding — block merge
          [ "$UNPINNED" -eq 0 ] || { echo "::error::One or more requirements files lack hash pinning. See warnings above."; exit 1; }

      # ── Phantom package detection — BLOCKING ────────────────────────────
      - name: Phantom package check (PyPI)
        if: hashFiles('**/requirements*.txt') != ''
        run: |
          set -euo pipefail
          PHANTOM=0
          while IFS= read -r req_file; do
            while IFS= read -r pkg; do
              # Strip version specifier and extras
              CLEAN=$(echo "$pkg" | sed 's/[>=<!\[].*//' | tr -d ' ')
              [ -z "$CLEAN" ] && continue
              HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
                "https://pypi.org/pypi/${CLEAN}/json" || true)
              if [ "$HTTP_STATUS" != "200" ]; then
                echo "::error::PHANTOM PACKAGE: '${CLEAN}' returned HTTP ${HTTP_STATUS} from PyPI — possible hallucinated package. BLOCKING MERGE."
                PHANTOM=1
              fi
            done < <(grep -E '^[a-zA-Z]' "$req_file" | sed '/^#/d')
          done < <(find . -name 'requirements*.txt' -not -path '*/.venv*' -not -path '*/node_modules*')
          [ "$PHANTOM" -eq 0 ] || exit 1

      - name: Phantom package check (npm)
        if: hashFiles('**/package.json') != ''
        run: |
          set -euo pipefail
          PHANTOM=0
          for PKG in $(node -e "const p=require('./package.json'); console.log(Object.keys({...p.dependencies,...p.devDependencies}).join('\n'))" 2>/dev/null || true); do
            HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              "https://registry.npmjs.org/${PKG}" || true)
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "::error::PHANTOM PACKAGE: '${PKG}' returned HTTP ${HTTP_STATUS} from npm — possible hallucinated package. BLOCKING MERGE."
              PHANTOM=1
            fi
          done
          [ "$PHANTOM" -eq 0 ] || exit 1

      # ── Secret scanning — BLOCKING ───────────────────────────────────────
      - name: Secret scanning (gitleaks)
        run: |
          # Pull pinned gitleaks image and scan full branch history
          docker run --rm \
            -v "$PWD:/path" \
            zricethezav/gitleaks:v8.18.4 \
            detect --source /path --log-opts "origin/main..HEAD" \
            --exit-code 1 \
            --redact
        # non-zero exit code blocks the step — any detected secret blocks merge

      # ── Post security-gate status comment ───────────────────────────────
      - name: Comment — security stage
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: success ? [
                '## 🔒 Stage: Security — Automated Pre-checks Passed',
                '',
                '**Security Engineer Agent** — your turn for the manual review.',
                '',
                'The automated gates have passed:',
                '- ✅ SAST (bandit)',
                '- ✅ Dependency CVE audit (pip-audit / npm audit)',
                '- ✅ Lockfile hash pinning verified',
                '- ✅ Phantom package check (PyPI / npm)',
                '- ✅ Secret scanning (gitleaks)',
                '',
                'Run the full security review in VS Code Copilot chat:',
                '```',
                '/opsx:verify  ← runs security review + OWASP + supply chain + code review',
                '```',
                '',
                'Security gate: no CRITICAL or HIGH findings to merge.',
              ].join('\n') : [
                '## 🔒 Stage: Security — ❌ AUTOMATED GATE FAILED',
                '',
                '**Merge is BLOCKED.** One or more automated security checks failed.',
                '',
                'Check the workflow run logs for details:',
                `- Bandit SAST, pip-audit, npm audit, lockfile pinning, phantom package check, or gitleaks`,
                '',
                '**Developer Agent** — remediate all flagged issues and re-push.',
                '',
                '> No manual security review will be started until the automated gate passes.',
              ].join('\n')
            });

  # ─── STAGE GATE: SECURITY → REVIEW ───────────────────────────────────────
  stage-review-gate:
    name: "👁️ Stage: Review"
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'stage:review'
    runs-on: ubuntu-latest
    steps:
      - name: Comment — review stage
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '## 👁️ Stage: Code Review',
                '',
                '**Code Reviewer Agent** — your turn.',
                '',
                'Run in VS Code Copilot chat:',
                '```',
                '/opsx:verify  ← includes code review stage',
                '```',
                '',
                'Review against `design.md` requirements and coding standards.',
                'Approve or REQUEST_CHANGES with specific, actionable feedback.',
              ].join('\n')
            });

  # ─── STAGE GATE: REVIEW → DEPLOY ──────────────────────────────────────────
  stage-deploy-gate:
    name: "🚀 Stage: Deploy"
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'stage:deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Comment — deploy stage
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '## 🚀 Stage: Deployment',
                '',
                '**DevOps/SRE Agent** — your turn.',
                '',
                'Merge this PR to trigger the staged deployment pipeline.',
                'The deployment workflow will:',
                '1. Build and scan the container image',
                '2. Deploy to dev → run smoke tests',
                '3. Deploy to staging → run integration tests',
                '4. Auto-advance to production (P2/P3) or await approval (P0/P1)',
                '',
                'Rollback is automatic if smoke tests fail.',
              ].join('\n')
            });

  # ─── SPEC STRUCTURE VALIDATION ────────────────────────────────────────────
  validate-openspec:
    name: "📋 Validate OpenSPEC Structure"
    if: |
      github.event_name == 'pull_request' &&
      (github.event.action == 'labeled' || github.event.action == 'ready_for_review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Validate spec/openspec structure
        run: |
          echo "Validating OpenSPEC structure..."
          
          # Check config exists
          [ -f "spec/openspec/config.yaml" ] && echo "✅ config.yaml present" || echo "❌ config.yaml missing"
          
          # Check domain specs exist
          for domain in sdlc-process personas idea-capture security-standards testing-standards operations; do
            [ -f "spec/openspec/specs/$domain/spec.md" ] \
              && echo "✅ specs/$domain/spec.md present" \
              || echo "⚠️  specs/$domain/spec.md missing"
          done
          
          # Check changes directory
          [ -d "spec/openspec/changes" ] && echo "✅ changes/ directory present" || echo "❌ changes/ missing"
          
          echo "OpenSPEC validation complete."
