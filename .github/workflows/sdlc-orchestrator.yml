name: SDLC Orchestrator
on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled, unlabeled, ready_for_review]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  # ─── IDEA INTAKE ──────────────────────────────────────────────────────────
  # Triggered when an issue gets the `idea` label (from the Idea Capture template)
  idea-intake:
    name: "💡 Idea → Proposal"
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'idea'
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge idea
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## 🏭 Software Fabric — Idea Received',
                '',
                'Your idea has been queued for the autonomous SDLC pipeline.',
                '',
                '**Next step:** The Product Owner Agent will transform this into an OpenSPEC proposal.',
                '',
                '**To start the pipeline now**, run in VS Code Copilot chat:',
                '```',
                `/opsx:propose  ← then reference issue #${context.issue.number}`,
                '```',
                '',
                '**Or use the full kickoff prompt:**',
                '```',
                'Use the sdlc-kickoff prompt from .github/prompts/sdlc-kickoff.prompt.md',
                '```',
                '',
                '**Pipeline stages:**',
                '1. 📋 Proposal (Product Owner)',
                '2. 🏗️ Design + Tasks (Architect)',
                '3. 💻 Implementation (Developer)',
                '4. 🧪 Tests (QA Engineer)',
                '5. 🔒 Security Review (Security Engineer)',
                '6. 👁️ Code Review (Code Reviewer)',
                '7. 🚀 Deploy (DevOps/SRE)',
                '8. 📊 Monitor + Archive (Operations SRE)',
              ].join('\n')
            });

      - name: Add stage label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['stage:proposal']
            });

  # ─── STAGE GATE: PROPOSAL → DESIGN ────────────────────────────────────────
  stage-design-gate:
    name: "🏗️ Stage: Design"
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'stage:design'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4.1.7
        with:
          fetch-depth: 0

      - name: Validate required design artifacts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t change_dirs < <(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
              | grep -E '^spec/openspec/changes/[^/]+/' \
              | cut -d/ -f1-4 \
              | sort -u
          )

          if [ "${#change_dirs[@]}" -eq 0 ]; then
            echo "::error::stage:design requires a change folder under spec/openspec/changes/<slug>/."
            exit 1
          fi

          for dir in "${change_dirs[@]}"; do
            if [ ! -f "$dir/design.md" ] || [ ! -f "$dir/tasks.md" ]; then
              echo "::error file=$dir::Missing required design stage artifact(s). Expected design.md and tasks.md."
              exit 1
            fi
          done

      - name: Comment — design stage started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '## 🏗️ Stage: Design',
                '',
                '**Architect Agent** — your turn.',
                '',
                'Run in VS Code Copilot chat:',
                '```',
                '/opsx:apply  ← will detect design stage and create design.md + tasks.md',
                '```',
                '',
                'Expected outputs:',
                '- `spec/openspec/changes/<slug>/design.md`',
                '- `spec/openspec/changes/<slug>/tasks.md`',
              ].join('\n')
            });

  # ─── STAGE GATE: IMPLEMENT → TEST ─────────────────────────────────────────
  stage-test-gate:
    name: "🧪 Stage: Test"
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'stage:test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4.1.7
        with:
          fetch-depth: 0

      - name: Validate test stage artifacts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          if ! printf '%s\n' "$changed_files" | grep -Eq '(^|/)(tests?|testdata)/|(^|/)(test_.*\.py|.*_test\.py|.*Tests?\.cs)$|^spec/openspec/changes/[^/]+/(tasks\.md|specs/testing-standards/spec\.md)$'; then
            echo "::error::stage:test requires test artifacts or test-stage spec/task evidence in the PR."
            exit 1
          fi

      - name: Require a supported test project
        if: hashFiles('**/pytest.ini', '**/pyproject.toml', '**/setup.cfg', '**/*.csproj') == ''
        run: |
          echo "::error::No supported test project was found. Add pytest configuration or a .NET project."
          exit 1

      - name: Run tests (Python)
        if: hashFiles('**/pytest.ini', '**/pyproject.toml', '**/setup.cfg') != ''
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest pytest-cov
          python3 -m pytest --tb=short -q --cov --cov-report=term-missing --cov-fail-under=80

      - name: Run tests (.NET)
        if: hashFiles('**/*.csproj') != ''
        run: dotnet test --no-build --collect:"XPlat Code Coverage" -q

      - name: Comment — test stage
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '## 🧪 Stage: Test',
                '',
                '**QA Engineer Agent** — your turn.',
                '',
                'Generate tests from spec scenarios and achieve ≥80% coverage.',
                '',
                'Run in VS Code Copilot chat:',
                '```',
                '/opsx:apply  ← will detect test stage and generate test suites',
                '```',
              ].join('\n')
            });

  # ─── STAGE GATE: TEST → SECURITY ──────────────────────────────────────────
  stage-security-gate:
    name: "🔒 Stage: Security"
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'stage:security'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4.1.7

      - name: Verify security automation checks are present and green
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          security_checks_json="$(gh pr checks "$PR_NUMBER" --json name,state)"

          matched_count="$(printf '%s' "$security_checks_json" | jq '[.[] | select((.name | ascii_downcase) | test("security|sbom|grype|dependency confusion|lockfile integrity"))] | length')"
          if [ "$matched_count" -eq 0 ]; then
            echo "::error::No security automation checks were found on this PR. Ensure Security workflow checks are configured."
            exit 1
          fi

          failing_checks="$(printf '%s' "$security_checks_json" | jq -r '.[] | select((.name | ascii_downcase) | test("security|sbom|grype|dependency confusion|lockfile integrity")) | select(.state != "SUCCESS") | "\(.name): \(.state)"')"
          if [ -n "$failing_checks" ]; then
            echo "::error::Security automation checks are not green:"
            echo "$failing_checks"
            exit 1
          fi

      - name: Confirm automated security workflow ownership
        run: |
          echo "Automated security checks are owned by the standalone Security workflow."
          echo "Require the Security workflow to pass in branch protection before stage:security."

      # ── Post security-gate status comment ───────────────────────────────
      - name: Comment — security stage
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: success ? [
                '## 🔒 Stage: Security — Automated Check Handoff',
                '',
                '**Security Engineer Agent** — your turn for the manual review.',
                '',
                'The standalone `Security` workflow owns the automated security checks:',
                '- ✅ SAST and dependency vulnerability checks',
                '- ✅ SBOM generation and Grype scanning',
                '- ✅ Lockfile integrity and phantom package checks',
                '- ✅ Secret scanning and container image pinning',
                '',
                'The `Security` workflow must pass through branch protection before merge.',
                '',
                'Run the full security review in VS Code Copilot chat:',
                '```',
                '/opsx:verify  ← runs security review + OWASP + supply chain + code review',
                '```',
                '',
                'Security gate: no CRITICAL or HIGH findings to merge.',
              ].join('\n') : [
                '## 🔒 Stage: Security — ❌ AUTOMATED GATE FAILED',
                '',
                '**Merge is BLOCKED.** One or more automated security checks failed.',
                '',
                'Check the `Security` workflow run logs for details.',
                '',
                '**Developer Agent** — remediate all flagged issues and re-push.',
                '',
                '> No manual security review will be started until the automated gate passes.',
              ].join('\n')
            });

  # ─── STAGE GATE: SECURITY → REVIEW ───────────────────────────────────────
  stage-review-gate:
    name: "👁️ Stage: Review"
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'stage:review'
    runs-on: ubuntu-latest
    steps:
      - name: Comment — review stage
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '## 👁️ Stage: Code Review',
                '',
                '**Code Reviewer Agent** — your turn.',
                '',
                'Run in VS Code Copilot chat:',
                '```',
                '/opsx:verify  ← includes code review stage',
                '```',
                '',
                'Review against `design.md` requirements and coding standards.',
                'Approve or REQUEST_CHANGES with specific, actionable feedback.',
              ].join('\n')
            });

  # ─── STAGE GATE: REVIEW → DEPLOY ──────────────────────────────────────────
  stage-deploy-gate:
    name: "🚀 Stage: Deploy"
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'stage:deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Comment — deploy stage
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '## 🚀 Stage: Deployment',
                '',
                '**DevOps/SRE Agent** — your turn.',
                '',
                'Merge this PR to trigger the staged deployment pipeline.',
                'The deployment workflow will:',
                '1. Build and scan the container image',
                '2. Deploy to dev → run smoke tests',
                '3. Deploy to staging → run integration tests',
                '4. Auto-advance to production (P2/P3) or await approval (P0/P1)',
                '',
                'Rollback is automatic if smoke tests fail.',
              ].join('\n')
            });

  # ─── SPEC STRUCTURE VALIDATION ────────────────────────────────────────────
  validate-openspec:
    name: "📋 Validate OpenSPEC Structure"
    if: |
      github.event_name == 'pull_request' &&
      (github.event.action == 'labeled' || github.event.action == 'ready_for_review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4.1.7

      - name: Validate spec/openspec structure
        run: |
          echo "Validating OpenSPEC structure..."
          
          # Check config exists
          [ -f "spec/openspec/config.yaml" ] && echo "✅ config.yaml present" || echo "❌ config.yaml missing"
          
          # Check domain specs exist
          for domain in sdlc-process personas idea-capture security-standards testing-standards operations; do
            [ -f "spec/openspec/specs/$domain/spec.md" ] \
              && echo "✅ specs/$domain/spec.md present" \
              || echo "⚠️  specs/$domain/spec.md missing"
          done
          
          # Check changes directory
          [ -d "spec/openspec/changes" ] && echo "✅ changes/ directory present" || echo "❌ changes/ missing"
          
          echo "OpenSPEC validation complete."
