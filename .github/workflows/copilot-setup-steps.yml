# Generated by OpenSpec for GitHub Copilot coding agent support.

name: "Copilot Setup Steps"

# Runs automatically when changed (for validation) and can be triggered manually.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` for Copilot coding agent to pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@latest

      - name: Verify prerequisites
        run: |
          node --version
          openspec --version
          openspec context --json
          openspec doctor
