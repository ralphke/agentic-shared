name: Fabric Release Gate

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Existing draft release ID with an existing immutable tag
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  release-gate:
    name: Fabric release control
    if: >-
      vars.FABRIC_PROTECTED_OPERATIONS_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: fabric-gate-control
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Gate and publish the unchanged draft release
        env:
          GH_TOKEN: ${{ secrets.FABRIC_GATE_APP_TOKEN }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: python3 .github/skills/fabric-verify-change/scripts/run_fabric_gate_control.py --mode release --number "$RELEASE_ID"

  configuration-notice:
    name: Fabric protected operations not enabled
    if: vars.FABRIC_PROTECTED_OPERATIONS_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report disabled enforcement
        run: |
          echo "::warning::Fabric protected operations are disabled. No Fabric approval or release publication is performed."
          echo "### Fabric protected operations: disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "Not configured; not enforced. Configure the dedicated App, protected environment, branch restrictions, policy and trusted evidence providers before setting FABRIC_PROTECTED_OPERATIONS_ENABLED=true. See doc/fabric-gate-evidence.md." >> "$GITHUB_STEP_SUMMARY"
